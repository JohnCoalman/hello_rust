name: Release Binaries

on:
  push:
    tags:
      - 'v1.0.2' # Se déclenche dès que vous poussez un tag commençant par 'v' (ex: v1.0.0)

permissions:
  contents: write

jobs:
  build-release:
    name: Build release pour Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compiler le projet en mode Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Préparer le fichier exe
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/hello_rust.exe -Destination hello_rust.exe

      - name: Publier la Release sur GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: hello_rust.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}