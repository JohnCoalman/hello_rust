name: Release Binaries

on:
  push:
    tags:
      - 'v*' # Se déclenche dès que vous poussez un tag commençant par 'v' (ex: v1.0.0)

jobs:
  build-release:
    name: Build release for ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: hello_rust.exe
            archive: hello_rust-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: hello_rust
            archive: hello_rust-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: hello_rust
            archive: hello_rust-macos.tar.gz

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Compiler le projet en mode Release
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Préparer l'archive (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} -DestinationPath ${{ matrix.platform.archive }}

      - name: Préparer l'archive (Linux / macOS)
        if: matrix.platform.os != 'windows-latest'
        run: |
          tar -czvf ${{ matrix.platform.archive }} -C target/${{ matrix.platform.target }}/release ${{ matrix.platform.bin }}

      - name: Publier la Release sur GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.platform.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}