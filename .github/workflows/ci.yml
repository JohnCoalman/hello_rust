name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer la cible WebAssembly
        run: rustup target add wasm32-unknown-unknown

      - name: Installer Trunk
        run: wget -qO- https://github.com/thedodd/trunk/releases/download/v0.16.0/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf -

      - name: Compiler le projet avec Trunk
        run: ./trunk build --release

      - name: Configurer les pages GitHub
        uses: actions/configure-pages@v4

      - name: Télécharger l'artefact du dossier dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4